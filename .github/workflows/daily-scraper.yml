name: Daily TechPulse Hardware Scraper

on:
  push:
    branches:
      - main
    paths:
      - 'scraper/**'
      - '.github/workflows/daily-scraper.yml'
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC) to keep BD retail prices and stock fresh
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Component Category to scrape (e.g., all, SSD, Processor, Monitor, Laptop, Keyboard, Mouse)'
        required: true
        default: 'all'
      max_pages:
        description: 'Maximum pages per store'
        required: false
        default: '2'

concurrency:
  group: techpulse-scraper
  cancel-in-progress: false

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: scraper/go.sum

      - name: Build Scraper Binary
        working-directory: ./scraper
        run: |
          go mod download
          go build -v -o scraper-runner .

      - name: Execute Scraper & Push to Supabase
        working-directory: ./scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://fuzwizxysoqcpucpllku.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CATEGORY="${{ inputs.category || github.event.inputs.category || 'all' }}"
          PAGES="${{ inputs.max_pages || github.event.inputs.max_pages || '2' }}"
          echo "Running Scraper for Category: $CATEGORY with max pages: $PAGES"
          ./scraper-runner -category "$CATEGORY" -pages "$PAGES"
