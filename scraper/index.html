<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataForge | Command Center</title>
    <style>
        :root { --bg-dark: #0e1117; --bg-panel: #262730; --bg-element: #1c1e24; --accent: #ff4b4b; --text-main: #fafafa; --text-dim: #ccc; --border: #333; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-dark); color: var(--text-main); padding: 0; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--bg-panel); padding: 20px; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; z-index: 10; }
        .brand-logo { font-size: 1.5em; font-weight: 800; letter-spacing: -1px; color: #fff; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .brand-accent { color: var(--accent); }
        .project-list { flex: 1; overflow-y: auto; margin-bottom: 20px; }
        .project-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .project-btn { flex: 1; text-align: left; padding: 12px; background: transparent; border: 1px solid transparent; color: #fff; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        .project-btn:hover { background: #333; }
        .project-btn.active { background: rgba(255, 75, 75, 0.1); border-color: var(--accent); color: var(--accent); font-weight: bold; }
        .del-btn { background: transparent; border: none; color: #666; cursor: pointer; padding: 0 10px; font-weight: bold; font-size: 1.2em; }
        .del-btn:hover { color: var(--accent); }
        .main { flex: 1; display: flex; flex-direction: column; padding: 0; overflow-y: hidden; position: relative; }
        .object-bar { background: var(--bg-element); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; align-items: center; overflow-x: auto; white-space: nowrap; flex-shrink: 0; }
        .object-btn { background: #333; color: #ccc; border: 1px solid #444; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 0.9em; transition: 0.2s; }
        .object-btn:hover { background: #444; color: white; }
        .object-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
        .editor-area { padding: 20px 40px; overflow-y: auto; flex: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; }
        .tab-btn { background: none; border: none; color: #888; padding: 10px 0; cursor: pointer; font-size: 16px; position: relative; }
        .tab-btn:hover { color: #ccc; }
        .tab-btn.active { color: #fff; font-weight: bold; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 3px; background: var(--accent); }
        .tab-content { display: none; animation: fadein 0.3s; }
        .tab-content.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--text-dim); }
        input, select, textarea { width: 100%; padding: 12px; background: #0e1117; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus, textarea:focus { outline: none; border-color: var(--accent); }
        .field-row { display: grid; grid-template-columns: 1fr 1.5fr 0.8fr 0.8fr 2fr 40px; gap: 10px; margin-bottom: 8px; align-items: center; background: var(--bg-element); padding: 10px; border-radius: 4px; }
        .btn-add { background: var(--bg-element); border: 1px dashed #555; width: 100%; padding: 12px; cursor: pointer; color: #aaa; margin-top: 10px; border-radius: 4px; }
        .btn-save-global { background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-del-obj { background: #d9534f; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-import { width: 100%; background: #333; color: #aaa; border: 1px dashed #555; padding: 8px; cursor: pointer; margin-top: 5px; text-align: center; border-radius: 4px; }
        
        /* SHUTDOWN BUTTON STYLE */
        .btn-shutdown {
            width: 100%; 
            background: #d9534f; 
            color: white; 
            border: none; 
            padding: 12px; 
            cursor: pointer; 
            margin-top: 5px; 
            text-align: center; 
            border-radius: 4px; 
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-shutdown:hover { background: #c9302c; }

        .log-box { background: #000; padding: 15px; height: 300px; overflow-y: auto; font-family: monospace; color: #0f0; border: 1px solid var(--border); border-radius: 4px; white-space: pre-wrap; font-size: 13px; }
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; height: auto; }
            .sidebar { width: 100%; height: auto; max-height: 250px; border-right: none; border-bottom: 1px solid var(--border); padding: 15px; }
            .main { overflow: visible; height: auto; }
            .editor-area { padding: 15px; overflow: visible; }
            .field-row { grid-template-columns: 1fr; gap: 5px; padding: 15px; position: relative; }
            #fields-header { display: none !important; }
            .field-row button { position: absolute; top: 5px; right: 5px; background: #333 !important; border-radius: 50%; width: 30px; height: 30px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand-logo"><span class="brand-icon">⚡</span><span>Data<span class="brand-accent">Forge</span></span></div>
        <h3 style="color: #888; font-size: 0.8em; text-transform: uppercase;">📂 Directories</h3>
        <div class="project-list" id="project-list">
            {{range .Projects}}
            <div class="project-row">
                <button class="project-btn" id="dir-{{.}}" onclick="loadDirectory('{{.}}')">{{.}}</button>
                <button class="del-btn" onclick="deleteProject('{{.}}')">×</button>
            </div>
            {{end}}
        </div>
        <div style="margin-top: 10px; border-top: 1px solid #444; padding-top: 15px;">
             <input type="text" id="new-project-name" placeholder="New Directory Name" style="margin-bottom: 8px;">
             <button class="btn-import" style="width:100%; border-style: solid; background: var(--bg-element); color: var(--text-main);" onclick="createProject()">+ Create Directory</button>
        </div>
        <div style="margin-top: 15px;">
             <button class="btn-import" onclick="document.getElementById('import-file').click()">⬆ Import JSON</button>
             <form id="import-form" style="display:none;"><input type="file" id="import-file" name="file" accept=".json" onchange="uploadConfig()"></form>
        </div>
        
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #444;">
             <button class="btn-shutdown" onclick="quitApp()">
                <span>⏻</span> SHUTDOWN SYSTEM
             </button>
        </div>
    </div>

    <div class="main">
        <div class="object-bar" id="object-bar"><span style="color: #666; font-style: italic;">Select a Directory...</span></div>
        <div class="editor-area">
            <div class="header">
                <h2 id="page-title">Config Editor</h2>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button class="btn-del-obj" onclick="deleteObject()">Trash</button>
                    <button class="btn-save-global" onclick="saveConfig()">Save</button>
                </div>
            </div>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('tab-setup', event)">Setup</button>
                <button class="tab-btn" onclick="switchTab('tab-fields', event)">Fields</button>
                <button class="tab-btn" onclick="switchTab('tab-pag', event)">Pagination</button>
                <button class="tab-btn" onclick="switchTab('tab-raw', event)">JSON</button>
                <button class="tab-btn" onclick="switchTab('tab-run', event)">Run</button>
            </div>
            <form id="scraper-form" onsubmit="event.preventDefault();">
                <input type="hidden" name="project" id="form-project">
                <div id="tab-setup" class="tab-content active">
                    <div class="form-group"><label>Object Name</label><input type="text" name="name" id="input-name" placeholder="e.g. Startech_Monitor" oninput="updateJsonView()"></div>
                    <div class="form-group"><label>Target URL</label><input type="text" name="url" id="input-url" placeholder="https://..." oninput="updateJsonView()"></div>
                    <div class="form-group"><label>Container Selector (CSS)</label><input type="text" name="container" id="input-container" placeholder="e.g. div.p-item" oninput="updateJsonView()"></div>
                </div>
                <div id="tab-fields" class="tab-content">
                    <div id="fields-header" style="display: grid; grid-template-columns: 1fr 1.5fr 0.8fr 0.8fr 2fr 40px; gap: 10px; margin-bottom: 5px; font-weight: bold; color: #888; font-size: 0.8em;">
                        <span>NAME</span><span>SELECTOR</span><span>ATTR</span><span>FILTER</span><span>FORMULA</span><span></span>
                    </div>
                    <div id="fields-container"></div>
                    <button type="button" class="btn-add" onclick="addField()">+ Add Field Row</button>
                    <div style="font-size: 0.8em; color: #666; margin-top: 15px; line-height: 1.5;"><strong>Attr Guide:</strong> Select 'None' to use <code>::attr(name)</code> in selector.<br><strong>Pipe Formula:</strong> <code>trim | upper</code> or <code>replace('|','') | normalize</code></div>
                </div>
                <div id="tab-pag" class="tab-content">
                    <div class="form-group"><label>Pagination Type</label>
                        <select name="pag_type" id="input-pag-type" onchange="togglePag(); updateJsonView();">
                            <option value="next_button">Next Button Click</option>
                            <option value="page_loop">Page Loop (?page=1,2,3)</option>
                            <option value="none">None</option>
                        </select>
                    </div>
                    <div class="form-group"><label id="lbl-pag-sel">Selector / Param</label><input type="text" name="pagination" id="input-pagination" placeholder="e.g. a[rel='next']" oninput="updateJsonView()"></div>
                    <div class="form-group"><label>Limit (Pages)</label><input type="number" name="limit" id="input-limit" value="10" oninput="updateJsonView()"></div>
                </div>
                <div id="tab-raw" class="tab-content"><textarea id="input-raw-json" style="height: 400px; width:100%;" spellcheck="false" oninput="updateFormView()"></textarea></div>
                <div id="tab-run" class="tab-content">
                    <div class="form-group"><label>Format</label><select name="format" id="input-format" onchange="updateJsonView()"><option value="csv">CSV</option></select></div>
                    <div style="margin-top: 20px;"><button type="button" class="btn-save-global" onclick="runScraper()">▶ RUN SCRAPER</button></div>
                    <h3 style="margin-top: 20px;">Execution Log</h3><div id="log-display" class="log-box">Ready...</div>
                </div>
            </form>
        </div>
    </div>
    <script>
        setInterval(() => { fetch('/heartbeat'); }, 1000);
        
        async function quitApp() {
            if(!confirm("Are you sure you want to SHUT DOWN?")) return;
            try {
                await fetch('/shutdown'); 
            } catch(e) {}
            document.body.innerHTML = '<div style="display:flex; justify-content:center; align-items:center; height:100vh; background:black; color:red; flex-direction:column;"><h1>SYSTEM OFFLINE</h1><p>The backend process has been terminated.</p><p>You can close this tab.</p></div>';
            window.close();
        }

        let currentProject = "";
        let currentObject = ""; 

        async function loadDirectory(name, targetFile = "") {
            currentProject = name;
            document.getElementById('form-project').value = name;
            document.querySelectorAll('.project-btn').forEach(b => b.classList.remove('active'));
            const dirBtn = document.getElementById('dir-' + name);
            if(dirBtn) dirBtn.classList.add('active');

            const res = await fetch('/list_configs?project=' + name);
            const configs = await res.json();
            
            const bar = document.getElementById('object-bar');
            bar.innerHTML = '';
            
            const newBtn = document.createElement('button');
            newBtn.className = 'object-btn btn-new-obj';
            newBtn.innerText = '+ New';
            newBtn.onclick = () => loadObject('');
            bar.appendChild(newBtn);

            let btnToClick = null;

            configs.forEach(conf => {
                const btn = document.createElement('button');
                btn.className = 'object-btn';
                btn.innerText = conf.replace('.json', '');
                btn.onclick = () => loadObject(conf, btn);
                bar.appendChild(btn);

                if (targetFile && conf === targetFile) {
                    btnToClick = btn;
                }
            });

            if (btnToClick) {
                btnToClick.click();
            } else if (configs.length > 0) {
                loadObject(configs[0], bar.children[1]);
            } else {
                loadObject('');
            }
        }

        async function loadObject(filename, btn) {
            currentObject = filename; 
            document.querySelectorAll('.object-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');

            if(currentProject) {
                const dirBtn = document.getElementById('dir-' + currentProject);
                if(dirBtn) dirBtn.classList.add('active');
            }

            if (!filename) {
                populateForm({}, true);
                document.getElementById('input-name').value = "New_Object";
                updateJsonView(); 
                return;
            }

            try {
                const res = await fetch('/get_config?project=' + currentProject + '&file=' + filename);
                const data = await res.json();
                populateForm(data, true);
            } catch(e) { console.log(e); }
        }

        async function deleteObject() {
            if(!currentObject) return alert("Select an object first!");
            if(!confirm("Delete '" + currentObject + "'?")) return;
            await fetch('/delete_config?project=' + currentProject + '&file=' + currentObject);
            loadDirectory(currentProject);
        }

        function togglePag() {
            const type = document.getElementById('input-pag-type').value;
            const lbl = document.getElementById('lbl-pag-sel');
            if (type === 'page_loop') {
                lbl.innerText = "URL Parameter (e.g. 'page')";
                document.getElementById('input-pagination').placeholder = "page";
            } else {
                lbl.innerText = "Next Button Selector (CSS)";
                document.getElementById('input-pagination').placeholder = "a[rel='next']";
            }
        }

        function getVal(obj, key) {
            if (!obj) return "";
            if (obj[key] !== undefined) return obj[key];
            const title = key.charAt(0).toUpperCase() + key.slice(1);
            if (obj[title] !== undefined) return obj[title];
            const upper = key.toUpperCase();
            if (obj[upper] !== undefined) return obj[upper];
            return "";
        }

        function populateForm(data, updateRaw) {
            const meta = data.meta || data.Meta || {};
            const container = data.container || data.Container || {};
            const pag = data.pagination || data.Pagination || {};
            const out = data.output || data.Output || {};

            document.getElementById('input-name').value = getVal(meta, 'name');
            document.getElementById('input-url').value = getVal(meta, 'url');
            document.getElementById('input-container').value = getVal(container, 'selector');
            
            document.getElementById('input-pag-type').value = getVal(pag, 'type') || 'next_button';
            document.getElementById('input-pagination').value = getVal(pag, 'selector');
            document.getElementById('input-limit').value = getVal(pag, 'limit') || 10;
            document.getElementById('input-format').value = getVal(out, 'format') || 'csv';

            const fields = data.fields || data.Fields || [];
            document.getElementById('fields-container').innerHTML = "";
            
            if (fields.length > 0) {
                fields.forEach(f => {
                    addField(getVal(f, 'name'), getVal(f, 'selector'), getVal(f, 'attr'), getVal(f, 'filter'), getVal(f, 'formula'), false);
                });
            } else {
                addField();
            }

            togglePag();
            if (updateRaw) document.getElementById('input-raw-json').value = JSON.stringify(data, null, 2);
        }

        function getFormData() {
            const data = {
                meta: { name: document.getElementById('input-name').value, url: document.getElementById('input-url').value },
                container: { selector: document.getElementById('input-container').value, type: "css" },
                pagination: {
                    type: document.getElementById('input-pag-type').value,
                    selector: document.getElementById('input-pagination').value,
                    limit: parseInt(document.getElementById('input-limit').value) || 10
                },
                output: { filename: document.getElementById('input-name').value, format: document.getElementById('input-format').value },
                fields: []
            };
            const names = document.getElementsByName('field_name[]');
            const sels = document.getElementsByName('field_selector[]');
            const attrs = document.getElementsByName('field_attr[]');
            const filters = document.getElementsByName('field_filter[]');
            const formulas = document.getElementsByName('field_formula[]');
            for(let i=0; i<names.length; i++) {
                if(names[i].value) {
                    data.fields.push({
                        name: names[i].value, selector: sels[i].value, attr: attrs[i].value, filter: filters[i].value, formula: formulas[i].value
                    });
                }
            }
            return data;
        }

        function updateJsonView() { document.getElementById('input-raw-json').value = JSON.stringify(getFormData(), null, 2); }
        function updateFormView() { try { populateForm(JSON.parse(document.getElementById('input-raw-json').value), false); } catch(e) {} }

        function addField(name="", sel="", attr="text", filter="none", formula="", sync=true) {
            const div = document.createElement('div');
            div.className = 'field-row';
            var html = '<input type="text" name="field_name[]" placeholder="Name" value="' + name + '" oninput="updateJsonView()">';
            html += '<input type="text" name="field_selector[]" placeholder="Selector" value="' + sel + '" oninput="updateJsonView()">';
            html += '<select name="field_attr[]" onchange="updateJsonView()">';
            html += '<option value="text" ' + (attr=='text'?'selected':'') + '>Text</option>';
            html += '<option value="href" ' + (attr=='href'?'selected':'') + '>Link</option>';
            html += '<option value="src" ' + (attr=='src'?'selected':'') + '>Image</option>';
            html += '<option value="none" ' + (attr=='none'?'selected':'') + '>None</option>';
            html += '</select>';
            html += '<select name="field_filter[]" onchange="toggleFormula(this); updateJsonView()">';
            html += '<option value="none" ' + (filter=='none'?'selected':'') + '>None</option>';
            html += '<option value="number" ' + (filter=='number'?'selected':'') + '>Number Only</option>';
            html += '<option value="url" ' + (filter=='url'?'selected':'') + '>Fix URL</option>';
            html += '<option value="custom" ' + (filter=='custom'?'selected':'') + '>Custom</option>';
            html += '</select>';
            const style = (filter === 'custom') ? 'display:block;' : 'display:none;';
            html += '<input type="text" name="field_formula[]" placeholder="Formula..." value="' + formula + '" style="' + style + '" oninput="updateJsonView()">';
            html += '<button type="button" onclick="this.parentElement.remove(); updateJsonView()">×</button>';
            div.innerHTML = html;
            document.getElementById('fields-container').appendChild(div);
            if(sync) updateJsonView();
        }

        function toggleFormula(selectElem) {
            const formulaInput = selectElem.parentElement.querySelector('input[name="field_formula[]"]');
            if (selectElem.value === 'custom') { formulaInput.style.display = 'block'; formulaInput.focus(); } else { formulaInput.style.display = 'none'; formulaInput.value = ''; }
        }

        function switchTab(id, e) {
            document.querySelectorAll('.tab-content').forEach(d => d.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(e) e.target.classList.add('active');
        }

        async function createProject() {
            const name = document.getElementById('new-project-name').value;
            if(!name) return;
            await fetch('/create?name=' + name);
            const list = document.getElementById('project-list');
            const row = document.createElement('div');
            row.className = 'project-row';
            const dirBtn = document.createElement('button');
            dirBtn.className = 'project-btn';
            dirBtn.id = 'dir-' + name;
            dirBtn.innerText = name;
            dirBtn.onclick = () => loadDirectory(name);
            const delBtn = document.createElement('button');
            delBtn.className = 'del-btn';
            delBtn.innerText = '×';
            delBtn.onclick = () => deleteProject(name);
            row.appendChild(dirBtn);
            row.appendChild(delBtn);
            list.appendChild(row);
            document.getElementById('new-project-name').value = "";
            loadDirectory(name);
        }

        async function deleteProject(name) {
            if(!confirm("Delete directory " + name + "?")) return;
            await fetch('/delete?name=' + name);
            const dirBtn = document.getElementById('dir-' + name);
            if (dirBtn) {
                const row = dirBtn.parentElement; 
                row.remove();
            }
            if (currentProject === name) {
                currentProject = "";
                currentObject = "";
                document.getElementById('object-bar').innerHTML = '<span style="color: #666; font-style: italic;">Select a Directory...</span>';
                document.getElementById('input-name').value = "";
                document.getElementById('input-url').value = "";
            }
        }

        async function saveConfig() {
            if(!currentProject) return alert("Select a directory first!");
            const formData = new FormData(document.getElementById('scraper-form'));
            if (currentObject) formData.append("file_override", currentObject);

            const res = await fetch('/save', { method: 'POST', body: formData });
            const savedFilename = await res.text();
            
            const btn = document.querySelector('.btn-save-global');
            const originalText = btn.innerText;
            btn.innerText = "✓ Saved";
            btn.style.background = "#218838";
            setTimeout(() => { btn.innerText = originalText; btn.style.background = "#28a745"; }, 1500);

            loadDirectory(currentProject, savedFilename);
        }

        async function uploadConfig() {
            if(!currentProject) return alert("Select a directory first!");
            const input = document.getElementById('import-file');
            if(input.files.length === 0) return;
            const formData = new FormData();
            formData.append("file", input.files[0]);
            formData.append("project", currentProject);
            const res = await fetch('/import', { method: 'POST', body: formData });
            if(res.ok) {
                const data = await res.json();
                populateForm(data, true);
                loadDirectory(currentProject);
                alert("Imported!");
            }
        }

        async function runScraper() {
            if(!currentProject) return alert("Select a directory!");
            const formData = new FormData(document.getElementById('scraper-form'));
            document.getElementById('log-display').innerText = "Starting...";
            switchTab('tab-run');
            await fetch('/run', { method: 'POST', body: formData });
        }

        setInterval(async () => {
            const res = await fetch('/logs');
            const text = await res.text();
            if(text) document.getElementById('log-display').innerText = text;
        }, 1000);
    </script>
</body>
</html>
